# Dependabot version updates. Exam notes:
# - This file controls VERSION updates only. Dependabot alerts and SECURITY updates
#   are switched on in Settings > Code security and need no config file.
# - Security updates still respect settings here (e.g. labels, reviewers, groups).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
