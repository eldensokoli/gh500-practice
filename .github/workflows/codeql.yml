# CodeQL "advanced setup". Exam notes:
# - Advanced setup and default setup are mutually exclusive. If default setup is
#   enabled in Settings > Code security, uploads from this workflow are rejected.
# - Interpreted languages (python, javascript) use build-mode: none.
#   Compiled languages (java, csharp, cpp, go, swift) use autobuild or manual.
# - Each matrix job uploads with its own category, so results don't overwrite each other.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"   # weekly, catches new queries against unchanged code
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF to code scanning
      contents: read
      actions: read            # only needed for private repos, harmless here
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
